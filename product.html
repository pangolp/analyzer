<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Productos</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        #app {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .upload-section {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e74c3c;
            color: white;
        }

        .btn-secondary:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .file-info {
            color: #666;
            font-size: 14px;
        }

        .search-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .results-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .product-name {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 15px;
        }

        .product-messages {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .product-messages div {
            margin-bottom: 5px;
        }

        .copy-btn {
            width: 100%;
            padding: 10px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: #27ae60;
            transform: scale(1.02);
        }

        .copy-btn.copied {
            background: #95a5a6;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            color: #999;
        }

        .no-results svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: white;
        }

        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 16px;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .results-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>🔍 Buscador de Productos</h1>
            <div class="upload-section">
                <div class="file-input-wrapper">
                    <label for="csvFile" class="btn btn-primary">
                        📁 Cargar CSV
                    </label>
                    <input type="file" id="csvFile" accept=".csv" @change="handleFileUpload">
                </div>
                <button v-if="products.length > 0" @click="clearData" class="btn btn-secondary">
                    🗑️ Limpiar datos
                </button>
                <span v-if="products.length > 0" class="file-info">
                    {{ products.length }} productos cargados
                </span>
            </div>
        </div>

        <div v-if="products.length > 0" class="search-section">
            <input 
                type="text" 
                v-model="searchQuery" 
                placeholder="Buscar por nombre, código o precio..."
                class="search-input"
                autofocus
            >
        </div>

        <div v-if="products.length === 0" class="empty-state">
            <svg fill="currentColor" viewBox="0 0 20 20">
                <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path>
                <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path>
            </svg>
            <h2>Bienvenido</h2>
            <p>Carga un archivo CSV para comenzar a buscar productos</p>
        </div>

        <div v-else class="results-section">
            <div v-if="filteredProducts.length === 0" class="no-results">
                <svg fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"></path>
                </svg>
                <h3>No se encontraron resultados</h3>
                <p>Intenta con otra búsqueda</p>
            </div>

            <div v-for="product in filteredProducts" :key="product.codigo" class="product-card">
                <div class="product-name">{{ product.producto }}</div>
                <div class="product-price">*${{ product.precio }} x kg*</div>
                <div class="product-messages">
                    <div v-for="(mensaje, index) in product.mensajes" :key="index">
                        {{ mensaje }}
                    </div>
                </div>
                <button @click="copyToClipboard(product)" class="copy-btn" :class="{ copied: product.copied }">
                    {{ product.copied ? '✓ Copiado!' : '📋 Copiar texto' }}
                </button>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    products: [],
                    searchQuery: '',
                };
            },
            computed: {
                filteredProducts() {
                    if (!this.searchQuery) {
                        return this.products;
                    }

                    const query = this.searchQuery.toLowerCase().trim();
                    
                    return this.products.filter(product => {
                        return product.producto.toLowerCase().includes(query) ||
                               product.codigo.toLowerCase().includes(query) ||
                               product.precio.toLowerCase().includes(query);
                    });
                }
            },
            methods: {
                removeQuotes(text) {
                    if (!text) return '';
                    // Eliminar comillas dobles al inicio y al final
                    return text.replace(/^[""]|[""]$/g, '');
                },
                handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    Papa.parse(file, {
                        header: true,
                        skipEmptyLines: true,
                        delimiter: ';',
                        complete: (results) => {
                            this.products = results.data.map(row => {
                                const mensajes = [];
                                
                                // Extraer todos los mensajes (Mensaje 1, Mensaje 2, etc.)
                                Object.keys(row).forEach(key => {
                                    if (key.startsWith('Mensaje') && row[key]) {
                                        mensajes.push(this.removeQuotes(row[key].trim()));
                                    }
                                });

                                return {
                                    producto: this.removeQuotes(row.Producto?.trim() || ''),
                                    codigo: this.removeQuotes(row.Codigo?.trim() || ''),
                                    precio: this.removeQuotes(row.Precio?.trim() || ''),
                                    mensajes: mensajes,
                                    copied: false
                                };
                            });

                            // Guardar en localStorage
                            localStorage.setItem('products', JSON.stringify(this.products));
                            
                            // Limpiar el input para permitir recargar el mismo archivo
                            event.target.value = '';
                        },
                        error: (error) => {
                            alert('Error al cargar el archivo: ' + error.message);
                        }
                    });
                },
                copyToClipboard(product) {
                    const text = this.formatProductText(product);
                    
                    navigator.clipboard.writeText(text).then(() => {
                        // Marcar como copiado
                        product.copied = true;
                        
                        // Resetear después de 2 segundos
                        setTimeout(() => {
                            product.copied = false;
                        }, 2000);
                    }).catch(err => {
                        alert('Error al copiar: ' + err);
                    });
                },
                formatProductText(product) {
                    let text = `${product.producto}\n`;
                    text += `*$${product.precio} x kg*\n`;
                    
                    product.mensajes.forEach(mensaje => {
                        text += `${mensaje}\n`;
                    });
                    
                    return text.trim();
                },
                clearData() {
                    if (confirm('¿Estás seguro de que quieres borrar todos los datos?')) {
                        this.products = [];
                        this.searchQuery = '';
                        localStorage.removeItem('products');
                    }
                },
                loadFromLocalStorage() {
                    const stored = localStorage.getItem('products');
                    if (stored) {
                        try {
                            this.products = JSON.parse(stored);
                        } catch (e) {
                            console.error('Error al cargar datos guardados:', e);
                        }
                    }
                }
            },
            mounted() {
                this.loadFromLocalStorage();
            }
        }).mount('#app');
    </script>
</body>
</html>
